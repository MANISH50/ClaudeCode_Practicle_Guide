{% extends "base.html" %}
{% block title %}{{ title }} - StayVista{% endblock %}

{% block content %}
<div class="detail-top"></div>
<div class="container py-5">
  <div class="empty-state text-center">
    <div class="error-code">{{ code }}</div>
    <h3 class="fw-bold">{{ title }}</h3>
    <p class="text-muted">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-brand me-2">Go home</a>
    <a href="{{ url_for('hotels') }}" class="btn btn-outline-brand">Browse hotels</a>
  </div>
</div>
{% endblock %}
